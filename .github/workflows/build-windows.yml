name: Build Doc Sign Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'doc_sign.py'
      - 'phone.html'
      - 'requirements.txt'
      - 'DocSign.iss'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build self-contained EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "Doc Sign" `
            --add-data "phone.html;." `
            --hidden-import win32timezone `
            doc_sign.py
          if (!(Test-Path "dist\Doc Sign.exe")) { throw "Doc Sign.exe was not created" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" DocSign.iss
          if (!(Test-Path "installer-output\Doc Sign-Setup.exe")) { throw "Doc Sign-Setup.exe was not created" }

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: Doc-Sign-Portable
          path: dist/Doc Sign.exe
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Doc-Sign-Installer
          path: installer-output/Doc Sign-Setup.exe
          if-no-files-found: error
