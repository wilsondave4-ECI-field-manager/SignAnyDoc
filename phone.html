<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doc Sign</title>
<style>
body{font-family:Segoe UI,Arial;margin:0;background:#f4f7fa;color:#10243d}
.wrap{max-width:720px;margin:auto;padding:16px}
.card{background:white;border:1px solid #dbe4ec;border-radius:16px;padding:18px;margin:14px 0}
input{padding:12px;border:1px solid #cad6df;border-radius:9px;width:100%;box-sizing:border-box;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
canvas{width:100%;height:310px;background:white;border:2px dashed #b9cad6;border-radius:12px;touch-action:none}
button{border:0;border-radius:10px;padding:12px 16px;background:#177a72;color:white;font-weight:700;font-size:16px}
.secondary{background:#eaf0f4;color:#18324b}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.actions button:last-child{margin-left:auto}.msg{padding:12px;border-radius:10px;background:#10243d;color:white;margin-top:12px}
@media(max-width:520px){.grid{grid-template-columns:1fr}.actions button{width:100%}}
</style></head>
<body><div class="wrap"><h2>Doc Sign</h2>
<div class="card"><h3>Connect to laptop</h3>
<div class="grid">
<div><label>Session code</label><input id="code"></div>
<div><label>PIN</label><input id="pin" inputmode="numeric"></div>
</div><br><button onclick="pair()">Connect</button><div id="pairmsg"></div></div>
<div class="card"><h3>Sign here</h3>
<canvas id="c"></canvas>
<div class="actions"><button class="secondary" onclick="clearC()">Clear</button><button onclick="send()">Confirm &amp; Send</button></div>
<div id="msg"></div></div>
</div>
<script>
const p=new URLSearchParams(location.search);
document.getElementById('code').value=p.get('code')||'';
document.getElementById('pin').value=p.get('pin')||'';
let paired=false,c=document.getElementById('c'),ctx=c.getContext('2d'),drawing=false;
function resize(){
 let r=c.getBoundingClientRect(),d=devicePixelRatio||1;
 c.width=Math.max(1,r.width*d);c.height=Math.max(1,r.height*d);
 ctx=c.getContext('2d');ctx.scale(d,d);
 ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#10243d';
}
resize();addEventListener('resize',resize);
function pt(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);let q=pt(e);ctx.beginPath();ctx.moveTo(q.x,q.y);drawing=true}
c.onpointermove=e=>{if(!drawing)return;let q=pt(e);ctx.lineTo(q.x,q.y);ctx.stroke()}
c.onpointerup=c.onpointercancel=()=>drawing=false;
function clearC(){ctx.clearRect(0,0,c.width,c.height)}
async function pair(){
 let code=document.getElementById('code').value.toUpperCase(),pin=document.getElementById('pin').value;
 let r=await fetch('/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,pin})});
 paired=r.ok;let x=document.getElementById('pairmsg');x.className='msg';x.textContent=r.ok?'Connected to laptop.':'Could not pair. Check code and PIN.'
}
async function send(){
 let x=document.getElementById('msg');
 if(!paired){x.className='msg';x.textContent='Connect to the laptop first.';return}
 let code=document.getElementById('code').value.toUpperCase(),pin=document.getElementById('pin').value;
 let signature=c.toDataURL('image/png');
 let r=await fetch('/api/signature',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,pin,signature})});
 x.className='msg';x.textContent=r.ok?'Signature sent directly to the laptop.':'Signature could not be sent.'
}
</script></body></html>
